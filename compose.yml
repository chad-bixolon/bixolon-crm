services:
  db:
    image: postgres:17
    container_name: bixolon-crm-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./postgres/data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - crm

  app:
    build:
      context: ./app
      target: development

    container_name: bixolon-crm-app
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_URL: ${AUTH_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      GOOGLE_WORKSPACE_DOMAIN: ${GOOGLE_WORKSPACE_DOMAIN}

      SPACES_BUCKET: ${SPACES_BUCKET}
      SPACES_REGION: ${SPACES_REGION}
      SPACES_ENDPOINT: ${SPACES_ENDPOINT}
      SPACES_ACCESS_KEY_ID: ${SPACES_ACCESS_KEY_ID}
      SPACES_SECRET_ACCESS_KEY: ${SPACES_SECRET_ACCESS_KEY}
      SPACES_PREFIX: ${SPACES_PREFIX}

    ports:
      - "3000:3000"

    volumes:
      - ./app:/app
      - /app/node_modules

    depends_on:
      db:
        condition: service_healthy

    networks:
      - crm

  adminer:
    image: adminer:latest
    container_name: bixolon-crm-adminer
    restart: unless-stopped

    profiles:
      - admin

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - crm

networks:
  crm:
    driver: bridge
